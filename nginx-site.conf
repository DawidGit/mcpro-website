# =============================================================================
# Nginx Site Configuration - Summit Commercial Construction Website
# Static site serving with caching and security optimizations
# =============================================================================

# -----------------------------------------------------------------------------
# Legacy URLs from the previous WordPress site → closest current page (301).
# Search Console still reports referrers like /blog/2024/09/.
# -----------------------------------------------------------------------------
map $uri $legacy_redirect {
    default "";
    ~^/blog(/|$)                                  /;
    ~^/(category|tag|author|feed)(/|$)            /;
    ~^/(about|about-us)/?$                        /#about;
    ~^/(contact|contact-us)/?$                    /#contact;
    ~^/(services|our-services)/?$                 /#services;
    ~^/(projects|portfolio|gallery)/?$            /;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # -------------------------------------------------------------------------
    # Security
    # -------------------------------------------------------------------------
    # Hide nginx version
    server_tokens off;

    # Canonical host: www → apex (Cloudflare passes the original Host header through)
    if ($host = www.mcprogc.com) {
        return 301 https://mcprogc.com$request_uri;
    }

    if ($legacy_redirect) {
        return 301 https://mcprogc.com$legacy_redirect;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to backup/config files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # -------------------------------------------------------------------------
    # SEO files — must be real XML/text (not SPA index.html fallback)
    # -------------------------------------------------------------------------
    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/security-headers.conf;
        default_type application/xml;
        add_header Content-Type "application/xml; charset=utf-8";
        try_files $uri =404;
    }

    location ~* ^/google[0-9a-f]+\.html$ {
        default_type text/html;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Health Check Endpoint
    # -------------------------------------------------------------------------
    location /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # -------------------------------------------------------------------------
    # Static Assets - Aggressive Caching
    # -------------------------------------------------------------------------
    # Images, fonts, media files
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf|eot|mp4|webm|ogg)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Try to serve file, fall back to 404
        try_files $uri =404;
    }
    
    # CSS and JavaScript files
    location ~* \.(css|js)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Try to serve file, fall back to 404
        try_files $uri =404;
    }
    
    # -------------------------------------------------------------------------
    # Canonical URLs for HTML pages
    # -------------------------------------------------------------------------
    # /index.html → /. Only for requests that literally asked for /index.html: "/" and the
    # 404 error_page reach this location through internal redirects and must be served.
    location = /index.html {
        if ($request_uri ~ "^/index\.html(\?|$)") {
            return 301 https://mcprogc.com/;
        }
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # /night-work.html → /night-work (the google*.html verification file matches the
    # location above this one first and is still served).
    location ~ ^/([a-z0-9-]+)\.html$ {
        return 301 https://mcprogc.com/$1$is_args$args;
    }

    # /night-work/ → /night-work
    location ~ ^/([a-z0-9-]+)/$ {
        return 301 https://mcprogc.com/$1$is_args$args;
    }

    # -------------------------------------------------------------------------
    # Main Application - Single Page Application (SPA) Handling
    # -------------------------------------------------------------------------
    location / {
        include /etc/nginx/security-headers.conf;
        # Apply rate limiting
        limit_req zone=general burst=20 nodelay;
        
        # Real files, / and the prerendered service pages (/night-work → night-work.html).
        # Unknown paths return a real 404 (error_page below serves index.html with the 404
        # status) instead of a "soft 404" 200.
        try_files $uri $uri.html $uri/ =404;
        
        # HTML must be revalidated on every visit (cheap 304 via ETag) so a new deploy is
        # visible immediately; hashed JS/CSS bundles stay cached for a year (see above).
        add_header Cache-Control "no-cache";
    }
    
    # -------------------------------------------------------------------------
    # Contact Form API — proxied to the contact-api container
    # -------------------------------------------------------------------------
    location ^~ /api/ {
        # Strict rate limiting for contact form (nginx-level, in addition to app-level)
        limit_req zone=contact burst=3 nodelay;
        limit_req_status 429;

        # Trailing slash strips the /api/ prefix: /api/contact → /contact,
        # /api/healthz → /healthz (matching the Express routes).
        proxy_pass http://contact-api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
    
    # -------------------------------------------------------------------------
    # Error Pages
    # -------------------------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/site-access.log main;
    error_log /var/log/nginx/site-error.log warn;
}

