# Security headers sent on every response.
#
# nginx does NOT inherit add_header directives into a location that defines its own
# add_header, so this file is included at http level (nginx.conf) AND inside every
# location in nginx-site.conf that uses add_header. Keep all security headers here.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# Content Security Policy.
# script-src/connect-src allow Cloudflare Web Analytics (beacon injected by Cloudflare at the edge)
# and Google Tag Manager / GA4 (gtm.js + measurement hits to *.google-analytics.com).
# frame-src allows the Google Maps embed (maps.google.com redirects to www.google.com)
# and the Cloudflare Turnstile widget.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google.com https://cloudflareinsights.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://www.google.com https://maps.google.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

