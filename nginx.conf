# =============================================================================
# Nginx Main Configuration - Summit Commercial Construction Website
# Production-ready with security headers and performance optimizations
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # Basic Settings
    # -------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Character set
    charset utf-8;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Connection handling
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # Request limits
    client_max_body_size 16M;
    client_body_buffer_size 128k;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_min_length 1000;
    
    # Brotli compression (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml application/json application/javascript application/xml+rss;
    
    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    # Defined in security-headers.conf (also included in each location that uses add_header)
    include /etc/nginx/security-headers.conf;
    
    # -------------------------------------------------------------------------
    # Real client IP
    # -------------------------------------------------------------------------
    # Visitors reach this container through Cloudflare and then a proxy/tunnel on
    # the VPS (the port is bound to 127.0.0.1 only), so $remote_addr is a local or
    # Docker address, shared by every visitor. That made the rate limits below,
    # the contact API limiter and the Turnstile remoteip apply to all visitors at
    # once. Take the visitor IP from Cloudflare's CF-Connecting-IP header, but only
    # when the request arrives from a local/private hop. Without the header (direct
    # local requests, health checks) $remote_addr stays as is.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from fc00::/7;
    real_ip_header CF-Connecting-IP;

    # -------------------------------------------------------------------------
    # Rate Limiting Zones (keyed by the real client IP set above)
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=contact:10m rate=1r/m;
    
    # -------------------------------------------------------------------------
    # Logging Format
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    
    # -------------------------------------------------------------------------
    # Include Site Configuration
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
